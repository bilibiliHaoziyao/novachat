name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK (32-bit + 64-bit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nova Chat inlines the (modified) deltachat-core-rust tree under
          # apps/android/jni/deltachat-core-rust — do NOT pull the upstream
          # submodule over it.
          submodules: false
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 'r29'

      - name: Install Rust toolchains
        run: |
          cd apps/android
          bash scripts/install-toolchains.sh

      - name: Compile core (arm64-v8a + armeabi-v7a)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd apps/android
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          # `ndk-make.sh` wipes the intermediate `jni/<abi>` dirs on every run,
          # but the final `ndk-build` output in `libs/` is kept. Running it once
          # per ABI therefore leaves both ABIs in `libs/`, which is what Gradle
          # packages into the APK (sourceSets.main.jniLibs.srcDirs = ['libs']).
          bash scripts/ndk-make.sh arm64-v8a
          bash scripts/ndk-make.sh armeabi-v7a
          echo "== packaged native libraries =="
          ls -R libs

      - name: Build release APK (foss flavor, signed with the repository keystore)
        run: |
          cd apps/android
          # The release keystore is committed at apps/android/keystore/novachat-release.jks,
          # so every build is signed with the same key and updates install over each other.
          ./gradlew --no-daemon assembleFossRelease

      - name: Collect and verify APK
        run: |
          cd apps/android
          APK=$(ls build/outputs/apk/foss/release/*.apk | head -1)
          cp "$APK" NovaChat-universal.apk
          ls -lh NovaChat-universal.apk

          echo "== bundled native libraries =="
          unzip -l NovaChat-universal.apk | grep -E 'lib/[^/]+/.*\.so$' || true

          # The Rust core is a *static* lib (libdeltachat.a) that ndk-build links
          # into libnative-utils.so — that is the shared object that must ship per ABI.
          echo "== verifying both target ABIs are packaged =="
          for abi in arm64-v8a armeabi-v7a; do
            unzip -l NovaChat-universal.apk | grep -q "lib/$abi/libnative-utils.so" \
              || { echo "ERROR: missing native core for $abi"; exit 1; }
            echo "ok: $abi"
          done

          APKSIGNER=$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs NovaChat-universal.apk
          else
            echo "apksigner not found in the SDK; skipping signature check (APK is signed by Gradle)"
          fi

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/NovaChat-universal.apk