name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Nova Chat inlines the (modified) deltachat-core-rust tree under
          # apps/android/jni/deltachat-core-rust — do NOT pull the upstream
          # submodule over it.
          submodules: false
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 'r29'

      - name: Install Rust toolchains
        run: |
          cd apps/android
          bash scripts/install-toolchains.sh

      - name: Compile core (arm64-v8a)
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cd apps/android
          export PATH="${PATH}:${ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/"
          bash scripts/ndk-make.sh arm64-v8a

      - name: Build release APK (foss flavor)
        run: |
          cd apps/android
          ./gradlew --no-daemon -PABI_FILTER=arm64-v8a assembleFossRelease

      - name: Sign APK with CI key
        run: |
          cd apps/android
          keytool -genkeypair -v -keystore /tmp/ci-release.jks -storepass novachat-ci -alias nova \
            -keypass novachat-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nova Chat, OU=Nova, O=Nova Chat, L=City, ST=State, C=CN" || true
          APK=$(ls app/build/outputs/apk/foss/release/*.apk | head -1)
          mv "$APK" /tmp/unsigned.apk
          BT=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/* 2>/dev/null | sort -V | tail -1)
          export PATH="${BT}:${PATH}"
          zipalign -f 4 /tmp/unsigned.apk /tmp/aligned.apk
          apksigner sign --ks /tmp/ci-release.jks --ks-pass pass:novachat-ci --key-pass pass:novachat-ci \
            --out "NovaChat-arm64-v8a.apk" /tmp/aligned.apk
          ls -lh NovaChat-arm64-v8a.apk

      - name: Upload APK to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/NovaChat-arm64-v8a.apk

  windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Build & package (NSIS + Portable)
        working-directory: apps/desktop/packages/target-electron
        run: |
          pnpm build
          pnpm run pack:generate_config
          pnpm run pack:patch-node-modules
          pnpm electron-builder --win nsis portable

      - name: Upload installers to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/packages/target-electron/dist/*.exe
